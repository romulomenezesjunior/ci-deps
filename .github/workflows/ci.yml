name: CI

on:
    push:
        branches: [main]
    pull_request: 

jobs:
    testes:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                version: 24
            - run: npm ci
            - run: npm run test
            
            
            






